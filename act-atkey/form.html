<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ATKey 資料請求・お問い合わせ（確認用）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F7F3F1;color:#1D1416;font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',Meiryo,sans-serif;line-height:1.7}
a{color:#A10228}a:hover{color:#7A011E}
.pv-band{background:#F2E9C9;color:#3A2F10;font-size:12px;text-align:center;padding:6px 12px}
.top{background:#150A0C;color:#fff;padding:28px 24px}
.in{max-width:720px;margin:0 auto}
.top span{font-size:13px;letter-spacing:.14em;color:#E3C78C}
h1{margin:6px 0 0;font-family:'Shippori Mincho B1','Hiragino Mincho ProN',serif;font-weight:800;font-size:clamp(22px,4.5vw,28px);line-height:1.4}
main{padding:24px 24px 64px}
.bars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bars i{height:6px;background:#D5C8C6}.bars i.on{background:#C10230}
.labels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:13px;font-weight:700;color:#4A3F41;margin-top:10px}
.step{display:none;flex-direction:column;gap:22px;margin-top:32px}
.step.on{display:flex}
h2{margin:0;font-size:22px;line-height:1.5}
.opt{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:72px;padding:12px 20px;border:1px solid #1D1416;border-radius:2px;background:#fff;cursor:pointer}
.opt:has(input:checked){border:2px solid #C10230;box-shadow:6px 6px 0 #C10230}
.opt strong{display:block;font-size:17px}.opt small{font-size:13px;color:#4A3F41}
.opt input{flex:none;width:22px;height:22px;accent-color:#C10230}
.field{display:flex;flex-direction:column;gap:8px}
.field label,.field legend{font-size:14px;font-weight:700;padding:0}
.req{color:#A10228}
.field input[type=text],.field input[type=email],.field input[type=tel]{height:56px;padding:0 16px;border:1px solid #1D1416;border-radius:2px;background:#fff;font:inherit;font-size:16px;width:100%}
fieldset{border:0;margin:0;padding:0}
.sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:8px}
.sizes label{display:flex;align-items:center;justify-content:center;min-height:56px;border:1px solid #1D1416;border-radius:2px;background:#fff;font-size:14px;font-weight:700;cursor:pointer}
.sizes input{position:absolute;opacity:0}
.sizes label:has(input:checked){background:#150A0C;color:#fff}
.sizes label:has(input:focus-visible),.opt:has(input:focus-visible){outline:3px solid #1D1416;outline-offset:2px}
.nav{display:flex;justify-content:space-between;gap:16px;margin-top:10px}
button{min-height:60px;border-radius:2px;font:inherit;font-weight:700;cursor:pointer}
.next{margin-left:auto;padding:0 clamp(20px,7vw,44px);background:#C10230;color:#fff;border:0;font-size:17px;box-shadow:0 6px 0 #62011A}
.back{flex:none;white-space:nowrap;padding:0 28px;background:transparent;color:#1D1416;border:1px solid #1D1416;font-size:16px}
button:focus-visible,input:focus-visible{outline:3px solid #1D1416;outline-offset:2px}
.err{display:none;color:#A10228;font-size:14px;font-weight:700;margin:0}
.done{align-items:center;text-align:center;padding-top:40px}
.done h2{font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:30px}
</style>
</head>
<body>
<div class="pv-band">このページは TAF Design の確認用の見本です。送信はされません。（著作権：TAF Design）</div>
<div class="top"><div class="in"><span>ATKey 資料請求・お問い合わせ</span><h1>3ステップ・約1分で完了します</h1></div></div>
<main><div class="in">
<div class="bars" aria-hidden="true"><i class="on"></i><i id="b2"></i><i id="b3"></i></div>
<div class="labels"><span>1 ご相談内容</span><span>2 会社情報</span><span>3 ご連絡先</span></div>

<form id="f" novalidate>
<section class="step on" data-step="1">
<h2>ご相談内容をお選びください</h2>
<label class="opt"><span><strong>資料がほしい</strong><small>ATKey提案資料をメールでお送りします</small></span><input type="radio" name="topic" value="資料請求" checked></label>
<label class="opt"><span><strong>デモ・評価機を試したい</strong><small>貸し出しのご相談を承ります</small></span><input type="radio" name="topic" value="デモ・評価機"></label>
<label class="opt"><span><strong>見積もりがほしい</strong><small>台数・形状に合わせてお見積りします</small></span><input type="radio" name="topic" value="見積もり"></label>
<label class="opt"><span><strong>まずは相談したい</strong><small>現状の認証環境の確認から対応します</small></span><input type="radio" name="topic" value="相談"></label>
<div class="nav"><button type="button" class="next" data-go="2">次へ進む</button></div>
</section>

<section class="step" data-step="2">
<h2>会社情報をご入力ください</h2>
<div class="field"><label for="company">会社名 <span class="req">必須</span></label><input id="company" name="company" type="text" autocomplete="organization" placeholder="例）ACT株式会社" required></div>
<div class="field"><label for="dept">部署名</label><input id="dept" name="dept" type="text" placeholder="例）情報システム部"></div>
<fieldset class="field"><legend>導入を検討している人数</legend>
<div class="sizes">
<label><input type="radio" name="size" value="〜50名">〜50名</label>
<label><input type="radio" name="size" value="51〜300名">51〜300名</label>
<label><input type="radio" name="size" value="301〜1,000名">301〜1,000名</label>
<label><input type="radio" name="size" value="1,001名〜">1,001名〜</label>
</div></fieldset>
<p class="err" role="alert">会社名をご入力ください。</p>
<div class="nav"><button type="button" class="back" data-go="1">戻る</button><button type="button" class="next" data-go="3">次へ進む</button></div>
</section>

<section class="step" data-step="3">
<h2>ご連絡先をご入力ください</h2>
<div class="field"><label for="name">お名前 <span class="req">必須</span></label><input id="name" name="name" type="text" autocomplete="name" placeholder="例）山田 太郎" required></div>
<div class="field"><label for="mail">メールアドレス <span class="req">必須</span></label><input id="mail" name="mail" type="email" autocomplete="email" placeholder="例）yamada@example.co.jp" required></div>
<div class="field"><label for="tel">電話番号</label><input id="tel" name="tel" type="tel" autocomplete="tel" placeholder="例）03-1234-5678"></div>
<p style="margin:0;font-size:13px;color:#4A3F41"><a href="index.html#privacy">プライバシーポリシー</a>に同意のうえ送信してください。</p>
<p class="err" role="alert">お名前とメールアドレスをご入力ください。</p>
<div class="nav"><button type="button" class="back" data-go="2">戻る</button><button type="button" class="next" data-go="4">この内容で送信する</button></div>
</section>

<section class="step done" data-step="4">
<svg aria-hidden="true" width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#C10230" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.5 3.5L17 9"/></svg>
<h2 tabindex="-1">送信が完了しました</h2>
<p style="margin:0;color:#4A3F41">お問い合わせありがとうございます。<br>担当者より折り返しご連絡いたします。</p>
<a href="index.html" style="font-weight:700">ATKeyのページへ戻る</a>
</section>
</form>
</div></main>
<script>
(function(){
var steps=[].slice.call(document.querySelectorAll('.step'));
function show(n){
steps.forEach(function(s){s.classList.toggle('on',s.dataset.step==String(n));});
document.getElementById('b2').classList.toggle('on',n>=2);
document.getElementById('b3').classList.toggle('on',n>=3);
var h=document.querySelector('.step.on h2');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});}
window.scrollTo(0,0);
}
document.getElementById('f').addEventListener('click',function(e){
var b=e.target.closest('button[data-go]');if(!b)return;
var cur=b.closest('.step'),to=Number(b.dataset.go);
if(b.classList.contains('next')){
var bad=[].slice.call(cur.querySelectorAll('input[required]')).filter(function(i){return !i.checkValidity();});
var err=cur.querySelector('.err');
if(bad.length){if(err)err.style.display='block';bad[0].focus();return;}
if(err)err.style.display='none';
}
show(to);
});
})();
</script>
</body>
</html>
