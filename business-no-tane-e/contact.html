<style>

<main class="in">
  <div class="card">
    <h1>お問い合わせ</h1>
    <p class="lead">ご質問などがございましたら、<wbr>下のフォームから<wbr>お気軽にお送りください。</p>
    <!-- お問い合わせフォーム（オートビズ「ビジたね｜問い合わせ」pid=3。送り先・項目名は管理画面の「フォームのHTMLソース」と同じ） -->
    <form id="cform" action="https://88auto.biz/busi-tane/planmail.php" method="post" accept-charset="UTF-8">
      <input type="hidden" name="mcode" value="UTF-8">
      <input type="hidden" name="pid" value="3">
      <input type="hidden" name="spflg" value="1">
      <input type="hidden" name="rgst" value="entry">
      <label class="f-row"><span>お名前<em>必須</em></span><input type="text" name="name1" required autocomplete="name" placeholder="例）山田 太郎"></label>
      <label class="f-row"><span>メールアドレス<em>必須</em></span><input type="email" name="email" required autocomplete="email" inputmode="email" placeholder="例）info@example.com"></label>
      <label class="f-row"><span>メールアドレス（確認）<em>必須</em></span><input type="email" name="_email" required autocomplete="email" inputmode="email" placeholder="もう一度ご入力ください"></label>
      <div class="f-row"><span>お問い合わせの種類<em>必須</em></span>
        <div class="f-checks">
          <label><input type="checkbox" name="fld1[]" value="ご質問"> ご質問</label>
          <label><input type="checkbox" name="fld1[]" value="営業"> 営業</label>
          <label><input type="checkbox" name="fld1[]" value="その他"> その他</label>
        </div>
        <p class="f-err" id="cerr">お問い合わせの種類を、1つ以上お選びください。</p>
      </div>
      <label class="f-row"><span>お問い合わせ内容<em>必須</em></span><textarea name="long1" required placeholder="お問い合わせの内容をご記入ください"></textarea></label>
      <button class="btn" type="submit" name="sbm" value="登録">内容を確認する</button>
      <p class="f-note">次の画面で入力内容をご確認いただけます。<wbr><a href="company.html#privacy">プライバシーポリシー</a>をご確認のうえ、<wbr>お送りください。</p>
    </form>
  </div>

<script>
/* 種類のチェックは1つ以上（オートビズ側で必須のため） */
document.getElementById("cform").addEventListener("submit",function(e){var c=this.querySelectorAll('input[name="fld1[]"]:checked').length,er=document.getElementById("cerr");if(!c){e.preventDefault();er.classList.add("on");er.scrollIntoView({block:"center",behavior:"smooth"});}else{er.classList.remove("on");}});
</script>
